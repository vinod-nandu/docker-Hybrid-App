services:
  # Local, self-hosted Neo4j (Community Edition) — an always-on alternative to
  # AuraDB Free, which auto-pauses after inactivity. Comment this whole service
  # out (and remove the backend's "depends_on: neo4j") if you want to keep using
  # AuraDB online instead; either way, only NEO4J_URI/USERNAME/PASSWORD in .env
  # decide which one the backend actually talks to.
  neo4j:
    image: neo4j:5.24-community
    container_name: hybrid_rag_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (what the backend connects to)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme12345}
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hybrid_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - faiss_storage:/app/backend/storage
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hybrid_rag_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  faiss_storage:
  neo4j_data:
  neo4j_logs:
